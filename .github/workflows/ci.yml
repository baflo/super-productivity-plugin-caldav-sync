name: CI

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck + unit tests + esbuild bundle + installable ZIP
      - run: npm run package
      - name: Read plugin version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: caldav-sync-v${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/caldav-sync.zip
          if-no-files-found: error

  # Tag a release (git tag vX.Y.Z && git push --tags) to publish the ZIP
  # as a GitHub release asset.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match manifest.json version $VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/caldav-sync.zip
          generate_release_notes: true
